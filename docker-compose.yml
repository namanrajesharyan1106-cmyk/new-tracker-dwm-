version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: doms_db
    environment:
      POSTGRES_USER: doms_user
      POSTGRES_PASSWORD: doms_password
      POSTGRES_DB: doms_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: doms_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
